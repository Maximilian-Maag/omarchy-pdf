name: tests

# Policy as code runs here too, but as part of the full suite: every test kind the
# plugin promises (unit, regression, integration, shell, e2e) plus mutation testing.
on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the policy check diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install suite dependencies
        # These are RUNTIME deps, not test-only extras. Without them the tests
        # that do the killing are skipped and the mutation score silently drops:
        #   - qpdf      -> pdf/pdffile.py's authoring path (fill/annotate)
        #   - PyQt6     -> the offscreen integration + viewer e2e (needs QtPdf;
        #                  Ubuntu's python3-pyqt6 ships no QtPdf, the wheel does)
        #   - the libs  -> what an offscreen Qt platform needs to start
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qpdf libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python3 -m pip install --quiet PyQt6
      - name: All test kinds (policy, unit, regression, integration, shell, e2e, mutation)
        run: bash tools/run_tests.sh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
